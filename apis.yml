aid: material-security
name: Material Security
description: >-
  Material Security is a cloud workspace security platform for Google Workspace
  and Microsoft 365. It connects via API (not an inline gateway) to give security
  teams unified detection and response across email, accounts and identity, and
  sensitive data — protecting against advanced email threats and phishing,
  preventing risky file sharing while automatically classifying sensitive data,
  and detecting account takeover and identity threats. Material is a private
  company backed by Andreessen Horowitz (a16z) and Amplify Partners.
